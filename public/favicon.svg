<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Таро — аркан Маг">
  <rect width="32" height="32" rx="4" fill="#1A0A0A"/>

  <!-- Карта: двойная золотая рамка -->
  <rect x="7.4" y="3.4" width="17.2" height="25.2" rx="2" fill="#221212" stroke="#C8973A" stroke-width="1.3"/>
  <rect x="9.6" y="5.6" width="12.8" height="20.8" rx="1" fill="none" stroke="#E8C87A" stroke-width="0.7" opacity="0.7"/>

  <!-- Орнамент над и под арканом -->
